<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Multi-Person Location Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #090d16;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid #1f2937;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
      margin-top: 24px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .default-creds {
      background: rgba(99, 102, 241, 0.1);
      border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-top: 20px;
      font-size: 12px;
      color: #c7d2fe;
      text-align: left;
      line-height: 1.5;
    }

    .default-creds b {
      color: #818cf8;
    }

    .alert-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="auth-card">
    
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <h1 id="headerTitle">Location Tracker</h1>
      <p class="subtitle">Enter your User ID and Password to access your Home Page</p>
    </div>

    <!-- Mode Tabs: Sign In / Register -->
    <div class="tabs">
      <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Register New</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
      
      <div class="form-group">
        <label for="userIdInput">User ID / Username</label>
        <input type="text" id="userIdInput" placeholder="Enter your User ID" required autofocus>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter your Password" required>
      </div>

      <div id="confirmPassGroup" class="form-group hidden">
        <label for="confirmPasswordInput">Confirm Password</label>
        <input type="password" id="confirmPasswordInput" placeholder="Re-enter your Password">
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span id="btnSubmitText">Login to Home Page</span>
      </button>

    </form>

    <div id="defaultCredsBox" class="default-creds">
      🔑 <b>Default Demo Login:</b><br>
      User ID: <code>admin</code><br>
      Password: <code>admin123</code><br>
      <i>(Or click "Register New" above to create your own User ID &amp; Password)</i>
    </div>

  </div>

  <script>
    const USERS_STORAGE_KEY = 'antigravity_registered_users';
    const SESSION_STORAGE_KEY = 'antigravity_logged_in_user';

    let currentMode = 'login'; // 'login' or 'register'

    // Initialize default admin user if none exists
    function initDefaultUsers() {
      const users = getUsers();
      if (!users['admin']) {
        users['admin'] = {
          userId: 'admin',
          password: 'admin123',
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
      }
    }

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('alertBox').style.display = 'none';

      if (mode === 'login') {
        document.getElementById('tabLogin').className = 'tab-btn active';
        document.getElementById('tabRegister').className = 'tab-btn';
        document.getElementById('confirmPassGroup').classList.add('hidden');
        document.getElementById('btnSubmitText').innerText = 'Login to Home Page';
        document.getElementById('defaultCredsBox').classList.remove('hidden');
      } else {
        document.getElementById('tabLogin').className = 'tab-btn';
        document.getElementById('tabRegister').className = 'tab-btn active';
        document.getElementById('confirmPassGroup').classList.remove('hidden');
        document.getElementById('btnSubmitText').innerText = 'Create Account & Login';
        document.getElementById('defaultCredsBox').classList.add('hidden');
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.className = isSuccess ? 'alert-msg alert-success' : 'alert-msg';
      box.style.display = 'block';
    }

    function handleAuth() {
      const userId = document.getElementById('userIdInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirmPass = document.getElementById('confirmPasswordInput').value;
      const users = getUsers();

      if (currentMode === 'register') {
        if (!userId || !password) {
          showAlert('Please fill in all fields.');
          return;
        }
        if (password !== confirmPass) {
          showAlert('Passwords do not match! Please check again.');
          return;
        }
        if (users[userId]) {
          showAlert('This User ID already exists. Please choose a different ID or Sign In.');
          return;
        }

        // Save new user
        users[userId] = {
          userId: userId,
          password: password,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));

        // Auto login
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
          userId: userId,
          token: 'token_' + Math.random().toString(36).substring(2),
          loginTime: new Date().toLocaleTimeString()
        }));

        showAlert('Account created successfully! Redirecting...', true);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);

      } else {
        // Login mode
        const user = users[userId];
        if (!user || user.password !== password) {
          showAlert('Invalid User ID or Password. Please try again or Register.');
          return;
        }

        // Set login session
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
          userId: userId,
          token: 'token_' + Math.random().toString(36).substring(2),
          loginTime: new Date().toLocaleTimeString()
        }));

        showAlert('Login successful! Redirecting to Home Page...', true);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      }
    }

    initDefaultUsers();

    // If already logged in, redirect directly to index.html
    if (localStorage.getItem(SESSION_STORAGE_KEY)) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
