<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum GPS - Secure Portal</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #12071f;
      color: #fdf2f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Animated Baby Pink & Purple Background */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.35) 0%, rgba(244, 114, 182, 0) 70%);
      filter: blur(40px);
      animation: floatOrb 14s infinite alternate ease-in-out;
    }

    .orb-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.32) 0%, rgba(192, 132, 252, 0) 70%);
      filter: blur(50px);
      animation: floatOrb 18s infinite alternate-reverse ease-in-out;
    }

    .radar-sweep {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 800px;
      height: 800px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(244, 114, 182, 0.2);
      pointer-events: none;
      animation: radarRotate 25s linear infinite;
    }

    .radar-sweep::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50%;
      height: 50%;
      background: conic-gradient(from 0deg, rgba(244, 114, 182, 0.2) 0deg, rgba(192, 132, 252, 0.12) 30deg, transparent 60deg);
      transform-origin: top left;
      border-radius: 0 100% 0 0;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.15); }
      100% { transform: translate(-30px, 60px) scale(0.95); }
    }

    @keyframes radarRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Glassmorphism Auth Card */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 16, 48, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(244, 114, 182, 0.25);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px -10px rgba(244, 114, 182, 0.25);
      position: relative;
      z-index: 10;
      animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Pastel Corner Accents */
    .auth-card::before, .auth-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .auth-card::before {
      top: 12px;
      left: 12px;
      border-top: 2px solid #f472b6;
      border-left: 2px solid #f472b6;
      border-top-left-radius: 12px;
    }
    .auth-card::after {
      bottom: 12px;
      right: 12px;
      border-bottom: 2px solid #c084fc;
      border-right: 2px solid #c084fc;
      border-bottom-right-radius: 12px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    .brand-icon-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #f472b6 0%, #c084fc 100%);
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 12px 30px rgba(244, 114, 182, 0.45);
      position: relative;
      z-index: 2;
      animation: iconFloat 4s ease-in-out infinite alternate;
    }

    .icon-pulse-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 28px;
      border: 2px solid rgba(244, 114, 182, 0.45);
      animation: iconPulse 2s infinite;
      z-index: 1;
    }

    @keyframes iconFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    @keyframes iconPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 20%, #fbcfe8 60%, #e9d5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 13px;
      color: #d8b4fe;
      line-height: 1.4;
    }

    /* Modern Sliding Pill Tabs */
    .tabs {
      display: flex;
      background: rgba(20, 10, 35, 0.7);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 24px;
      border: 1px solid rgba(244, 114, 182, 0.2);
      position: relative;
    }

    .tab-btn {
      flex: 1;
      padding: 11px 14px;
      border: none;
      background: none;
      color: #d8b4fe;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.35), rgba(192, 132, 252, 0.3));
      border: 1px solid rgba(244, 114, 182, 0.45);
      color: #fbcfe8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #f9a8d4;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(20, 10, 35, 0.85);
      border: 1px solid rgba(244, 114, 182, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: #f472b6;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.25), 0 0 20px rgba(192, 132, 252, 0.2);
      background: rgba(25, 12, 45, 1);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f472b6 0%, #c084fc 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(244, 114, 182, 0.45);
      margin-top: 24px;
      position: relative;
      overflow: hidden;
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.35), transparent);
      transform: rotate(25deg);
      transition: all 0.6s ease;
    }

    .btn-submit:hover::after {
      left: 130%;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(192, 132, 252, 0.55);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .default-creds {
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 22px;
      font-size: 12px;
      color: #fbcfe8;
      text-align: left;
      line-height: 1.5;
    }

    .default-creds b {
      color: #f472b6;
    }

    .alert-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      text-align: left;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .alert-success {
      background: rgba(244, 114, 182, 0.2);
      border: 1px solid rgba(244, 114, 182, 0.5);
      color: #fbcfe8;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Ambient Radar Animation Background -->
  <div class="bg-canvas">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="radar-sweep"></div>
  </div>

  <div class="auth-card">
    
    <div class="brand-header">
      <div class="brand-icon-wrap">
        <div class="icon-pulse-ring"></div>
        <div class="brand-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
          </svg>
        </div>
      </div>
      <h1 id="headerTitle">Quantum GPS Portal</h1>
      <p class="subtitle">Real-time 500km+ Multi-Person Tracking Hub</p>
    </div>

    <!-- Mode Tabs: Sign In / Register -->
    <div class="tabs">
      <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Register New</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
      
      <div class="form-group">
        <label for="userIdInput">User ID / Username</label>
        <input type="text" id="userIdInput" placeholder="Enter your User ID" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter your Password" required autocomplete="current-password">
      </div>

      <div id="confirmPassGroup" class="form-group hidden">
        <label for="confirmPasswordInput">Confirm Password</label>
        <input type="password" id="confirmPasswordInput" placeholder="Re-enter your Password" autocomplete="new-password">
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span id="btnSubmitText">Login to Command Hub</span>
      </button>

    </form>

    <div id="defaultCredsBox" class="default-creds">
      🔑 <b>Default Demo Login:</b><br>
      User ID: <code>admin</code> &bull; Password: <code>admin123</code><br>
      <i>(Or click "Register New" above to create your personal account)</i>
    </div>

  </div>

  <script>
    const USERS_STORAGE_KEY = 'antigravity_registered_users';
    const SESSION_STORAGE_KEY = 'antigravity_logged_in_user';

    let currentMode = 'login';

    function initDefaultUsers() {
      const users = getUsers();
      if (!users['admin']) {
        users['admin'] = {
          userId: 'admin',
          password: 'admin123',
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
      }
    }

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('alertBox').style.display = 'none';

      if (mode === 'login') {
        document.getElementById('tabLogin').className = 'tab-btn active';
        document.getElementById('tabRegister').className = 'tab-btn';
        document.getElementById('confirmPassGroup').classList.add('hidden');
        document.getElementById('btnSubmitText').innerText = 'Login to Command Hub';
        document.getElementById('defaultCredsBox').classList.remove('hidden');
      } else {
        document.getElementById('tabLogin').className = 'tab-btn';
        document.getElementById('tabRegister').className = 'tab-btn active';
        document.getElementById('confirmPassGroup').classList.remove('hidden');
        document.getElementById('btnSubmitText').innerText = 'Create Account & Enter';
        document.getElementById('defaultCredsBox').classList.add('hidden');
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.className = isSuccess ? 'alert-msg alert-success' : 'alert-msg';
      box.style.display = 'block';
    }

    function handleAuth() {
      const userId = document.getElementById('userIdInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirmPass = document.getElementById('confirmPasswordInput').value;
      const users = getUsers();

      if (currentMode === 'register') {
        if (!userId || !password) {
          showAlert('Please fill in all fields.');
          return;
        }
        if (password !== confirmPass) {
          showAlert('Passwords do not match! Please check again.');
          return;
        }
        if (users[userId]) {
          showAlert('This User ID already exists. Please choose a different ID or Sign In.');
          return;
        }

        users[userId] = {
          userId: userId,
          password: password,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));

        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
          userId: userId,
          token: 'token_' + Math.random().toString(36).substring(2),
          loginTime: new Date().toLocaleTimeString()
        }));

        showAlert('Account created successfully! Redirecting...', true);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);

      } else {
        const user = users[userId];
        if (!user || user.password !== password) {
          showAlert('Invalid User ID or Password. Please try again or Register.');
          return;
        }

        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
          userId: userId,
          token: 'token_' + Math.random().toString(36).substring(2),
          loginTime: new Date().toLocaleTimeString()
        }));

        showAlert('Login verified! Launching Command Hub...', true);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      }
    }

    initDefaultUsers();

    if (localStorage.getItem(SESSION_STORAGE_KEY)) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
