<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Location Broadcaster (1s Updates)</title>
  
  <!-- Standalone HiveMQ Cloud MQTT Library -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 28px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .glow {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(99, 102, 241, 0.1));
      border: 2px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
    }

    .icon-wrapper.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
      animation: radar-pulse 1.2s infinite;
    }

    @keyframes radar-pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .input-box {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .name-input {
      width: 100%;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .name-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-gps {
      width: 100%;
      padding: 18px 20px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    .btn-gps:active {
      transform: scale(0.98);
    }

    .btn-gps.connected {
      background: #065f46;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
    }

    .live-stream-panel {
      margin-top: 20px;
      padding: 16px;
      background: #090d16;
      border: 1px solid #1f2937;
      border-radius: 16px;
      text-align: left;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #eab308;
      flex-shrink: 0;
    }

    .status-indicator.live {
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .status-info {
      flex: 1;
      font-size: 13px;
      color: #cbd5e1;
    }

    .status-info b {
      display: block;
      color: #ffffff;
      font-size: 14px;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .telemetry-item {
      background: #111827;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }
    .telemetry-item span {
      display: block;
      color: #38bdf8;
      font-size: 12px;
      font-weight: bold;
    }

    .privacy-tag {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glow"></div>
    
    <div class="content">
      
      <div id="iconBox" class="icon-wrapper">
        <svg id="svgPin" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>

      <h1 id="mainHeading">Live GPS Broadcaster</h1>
      <p id="mainDesc" class="desc">
        Real-time GPS updates stream continuously every second to the host map.
      </p>

      <div class="input-box">
        <label class="input-label">Your Name or Nickname</label>
        <input id="userNameInput" type="text" class="name-input" placeholder="e.g. John, Sarah, Friend">
      </div>

      <button id="btnTurnOnGPS" class="btn-gps">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span id="btnText">Turn On 1-Second Live GPS</span>
      </button>

      <!-- Live 1-Second Telemetry Status Panel -->
      <div class="live-stream-panel">
        <div class="status-row">
          <div id="statusDot" class="status-indicator"></div>
          <div class="status-info">
            <b id="statusTitle">GPS Standby</b>
            <span id="statusSubtitle">Waiting for location activation</span>
          </div>
        </div>

        <div id="telemetryGrid" class="telemetry-grid" style="display: none;">
          <div class="telemetry-item">
            Updates Streamed:
            <span id="statUpdatesCount">0</span>
          </div>
          <div class="telemetry-item">
            Broadcast Rate:
            <span id="statFrequency">1 per second (1Hz)</span>
          </div>
          <div class="telemetry-item">
            GPS Accuracy:
            <span id="statAccuracy">Acquiring...</span>
          </div>
          <div class="telemetry-item">
            Live Speed:
            <span id="statSpeed">0 km/h</span>
          </div>
        </div>
      </div>

      <div class="privacy-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Private • Securely sent only to room host</span>
      </div>

    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default-room';

    let clientId = localStorage.getItem('antigravity_persistent_client_id');
    if (!clientId) {
      clientId = 'user_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('antigravity_persistent_client_id', clientId);
    }

    const savedName = localStorage.getItem('antigravity_participant_name') || ('Friend ' + Math.floor(Math.random() * 900 + 100));
    const nameInput = document.getElementById('userNameInput');
    nameInput.value = savedName;

    const mqttTopic = `antigravity_tracker_v3/${roomId}/${clientId}`;
    const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'sender_' + clientId + '_' + Math.random().toString(36).substring(2, 5),
      clean: true,
      reconnectPeriod: 2000
    });

    let liveIntervalId = null;
    let watchPositionId = null;
    let updatesCounter = 0;
    let isLiveStreaming = false;

    function activateGPS() {
      const name = nameInput.value.trim() || savedName;
      localStorage.setItem('antigravity_participant_name', name);
      
      document.getElementById('statusTitle').innerText = "Requesting GPS Access...";
      document.getElementById('statusSubtitle').innerText = "Please tap 'Allow' on your phone";
      document.getElementById('btnText').innerText = "Acquiring GPS Signal...";

      if (!navigator.geolocation) {
        showError("Geolocation is not supported by your browser.");
        return;
      }

      // 1. Initial Position Acquisition
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          startLive1SecondBroadcaster(name);
        },
        (error) => {
          navigator.geolocation.getCurrentPosition(
            (pos2) => {
              startLive1SecondBroadcaster(name);
            },
            (error2) => {
              let msg = "Please allow location permission in your phone/browser settings.";
              if (error2.code === error2.PERMISSION_DENIED) {
                msg = "Location permission denied. Please enable location in browser settings and tap again.";
              }
              showError(msg);
            },
            { enableHighAccuracy: false, timeout: 6000 }
          );
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    // 2. High-Frequency 1-Second Continuous Broadcaster
    function startLive1SecondBroadcaster(name) {
      isLiveStreaming = true;
      document.getElementById('iconBox').className = 'icon-wrapper active';
      document.getElementById('statusDot').className = 'status-indicator live';
      document.getElementById('statusTitle').innerText = "🟢 Streaming Live Location";
      document.getElementById('statusSubtitle').innerText = `Updating every 1 second to Host (${roomId})`;
      document.getElementById('btnTurnOnGPS').className = 'btn-gps connected';
      document.getElementById('btnText').innerText = "✓ Live 1s Broadcaster Active";
      document.getElementById('telemetryGrid').style.display = 'grid';

      // Clear existing timers if any
      if (liveIntervalId) clearInterval(liveIntervalId);
      if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);

      // Active poll exactly every 1000ms (1 second) with maximumAge: 0 to force real GPS hardware updates
      const pollGPS = () => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            processAndBroadcast(pos, name);
          },
          (err) => {
            // Fallback for fast response
            navigator.geolocation.getCurrentPosition(
              (pos2) => processAndBroadcast(pos2, name),
              null,
              { enableHighAccuracy: false, maximumAge: 0, timeout: 1500 }
            );
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 2000 }
        );
      };

      // Run immediately
      pollGPS();

      // Repeat every 1000ms (1 second)
      liveIntervalId = setInterval(pollGPS, 1000);

      // Also attach native watchPosition for instant motion sensor triggers
      watchPositionId = navigator.geolocation.watchPosition(
        (pos) => {
          processAndBroadcast(pos, name);
        },
        null,
        { enableHighAccuracy: true, maximumAge: 0, timeout: 2000 }
      );
    }

    function processAndBroadcast(position, name) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy || 0);
      const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0; // m/s to km/h

      updatesCounter++;

      // Update on-screen telemetry
      document.getElementById('statUpdatesCount').innerText = `${updatesCounter} updates`;
      document.getElementById('statAccuracy').innerText = `±${accuracy}m`;
      document.getElementById('statSpeed').innerText = `${speed} km/h`;

      const payload = {
        id: clientId,
        name: name,
        lat: lat,
        lng: lng,
        accuracy: accuracy,
        speed: speed,
        room: roomId,
        updateIndex: updatesCounter,
        timestamp: new Date().toLocaleTimeString()
      };

      const jsonStr = JSON.stringify(payload);

      // 1. MQTT Cloud Relay (Publish with retain so it never drops)
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(mqttTopic, jsonStr, { qos: 1, retain: true });
      } else {
        mqttClient.on('connect', () => {
          mqttClient.publish(mqttTopic, jsonStr, { qos: 1, retain: true });
        });
      }

      // 2. Local Server API
      fetch('/api/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: jsonStr
      }).catch(() => {});

      // 3. Local BroadcastChannel
      try {
        const bc = new BroadcastChannel('location_channel_' + roomId);
        bc.postMessage(payload);
      } catch (e) {}
    }

    function showError(msg) {
      document.getElementById('statusDot').className = 'status-indicator';
      document.getElementById('statusTitle').innerText = "Permission Required";
      document.getElementById('statusSubtitle').innerText = msg;
      document.getElementById('btnText').innerText = "Tap to Turn On GPS";
    }

    document.getElementById('btnTurnOnGPS').addEventListener('click', activateGPS);

    // Auto-start on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(activateGPS, 300);
    });
  </script>
</body>
</html>
