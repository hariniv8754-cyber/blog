name: Build Quantum GPS Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK
        working-directory: android-tracker-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit and Push APK to Repository
        run: |
          cp android-tracker-app/app/build/outputs/apk/debug/app-debug.apk ./QuantumGPS-Tracker.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f QuantumGPS-Tracker.apk
          git commit -m "Auto-compiled QuantumGPS-Tracker.apk [skip ci]" || echo "No changes"
          git push origin HEAD:main || echo "Push failed"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0
          name: "Quantum GPS Tracker App v1.0.0"
          body: "Official Android Native Background Location Tracker (.apk). Never stops transmitting even when swiped away or screen is locked."
          files: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantumGPS-Tracker-APK
          path: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk
