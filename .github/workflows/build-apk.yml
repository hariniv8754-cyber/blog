name: Build Quantum GPS Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK
        run: |
          cd android-tracker-app
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build_log.txt 2>&1 || true
          cd ..
          if [ -f "android-tracker-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android-tracker-app/app/build/outputs/apk/debug/app-debug.apk ./QuantumGPS-Tracker.apk
            echo "APK built successfully!"
          else
            echo "APK build failed! Log attached to build_log.txt"
          fi

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload APK Artifact
        if: hashFiles('android-tracker-app/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuantumGPS-Tracker-APK
          path: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        if: hashFiles('android-tracker-app/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Quantum GPS Tracker App v1.0.0"
          body: "Official Android Native Background Location Tracker (.apk). Never stops transmitting even when swiped away or screen is locked."
          files: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
