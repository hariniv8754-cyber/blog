name: Build Quantum GPS Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK
        run: |
          cd android-tracker-app
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build_log.txt 2>&1 || (
            cd ..
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git checkout -b build-debug-log
            git add build_log.txt
            git commit -m "Add build failure log"
            git push -f origin build-debug-log
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumGPS-Tracker-APK
          path: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Quantum GPS Tracker App v1.0.0"
          body: "Official Android Native Background Location Tracker (.apk). Never stops transmitting even when swiped away or screen is locked."
          files: android-tracker-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
